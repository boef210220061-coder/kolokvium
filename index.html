const QUESTIONS = [{"id": 1, "topic": 1, "title": "Понятие труда и формы общественной организации труда", "answer": "Труд — это целенаправленная деятельность человека, в процессе которой он применяет свои физические и умственные способности для создания материальных или духовных благ.\n\nОсновные формы труда — самостоятельный и наёмный труд. При самостоятельном человек организует работу сам, а при наёмном выполняет работу в интересах работодателя за заработную плату.\n\nТрудовое право регулирует прежде всего организованный наёмный труд.", "prompt": "Какие две основные формы труда выделяют?", "correct": "Самостоятельный и наёмный", "options": ["Самостоятельный и наёмный", "Обязательный и добровольный", "Государственный и частный", "Основной и дополнительный"], "hint": "Кто организует работу: сам человек или работодатель?", "memory": "Труд: сам организую или работаю по найму.", "example": "Владелец кофейни работает на себя; нанятый бариста — на работодателя."}, {"id": 2, "topic": 1, "title": "Трудовое право как отрасль права", "answer": "Трудовое право — самостоятельная отрасль российского права, регулирующая трудовые отношения и иные непосредственно связанные с ними отношения.\n\nОно регулирует приём на работу, рабочее время, отдых, заработную плату, дисциплину, охрану труда, увольнение, трудовые споры и другие вопросы.\n\nСамостоятельность трудового права определяется наличием собственного предмета и метода правового регулирования.", "prompt": "Что регулирует трудовое право как самостоятельная отрасль?", "correct": "Трудовые и непосредственно связанные с ними отношения", "options": ["Трудовые и непосредственно связанные с ними отношения", "Только заключение и прекращение трудового договора", "Любые отношения по поводу имущества", "Только выплаты пенсий и пособий"], "hint": "Вспомни: главные отношения и те, что их сопровождают.", "memory": "Отрасль = свой предмет + свой метод.", "example": "Правила оформления бариста, график его смен и отпуск относятся к трудовому праву."}, {"id": 3, "topic": 1, "title": "Предмет трудового права", "answer": "Предмет трудового права — это круг общественных отношений, которые регулируются нормами трудового права.\n\nГлавные — трудовые отношения между работником и работодателем: работник лично выполняет определённую трудовую функцию за плату и подчиняется установленному трудовому распорядку.\n\nКроме них сюда относятся отношения по трудоустройству, социальному партнёрству, охране труда, материальной ответственности, контролю и разрешению трудовых споров.\n\nЗапомнить: трудовые отношения + отношения, непосредственно связанные с трудом.", "prompt": "Что входит в предмет трудового права?", "correct": "Трудовые отношения, а также трудоустройство, партнёрство и разрешение трудовых споров", "options": ["Трудовые отношения, а также трудоустройство, партнёрство и разрешение трудовых споров", "Только личное выполнение работы за зарплату", "Купля-продажа имущества работодателя", "Пенсии и наследование заработка"], "hint": "Предмет отвечает на вопрос «что регулируем?».", "memory": "Предмет: трудовые + непосредственно связанные отношения.", "example": "Работа бариста — основное отношение; спор о невыплаченной зарплате — связанное.", "supplement": "Работник выполняет трудовую функцию в интересах, под управлением и контролем работодателя. Спор о невыплаченной зарплате относится к отношениям, непосредственно связанным с трудовыми."}, {"id": 4, "topic": 1, "title": "Метод трудового права", "answer": "Метод трудового права — это совокупность способов, которыми регулируются трудовые отношения.\n\nОсновные особенности метода:\n\n\t•\tсочетание государственного и локального регулирования;\n\t•\tсочетание законодательного и договорного регулирования;\n\t•\tравенство сторон при заключении трудового договора и подчинение работника трудовому распорядку после его заключения;\n\t•\tспециальные способы защиты трудовых прав.\n\nЗапомнить: государство + договор + подчинение + защита.", "prompt": "Какое сочетание характерно для метода трудового права?", "correct": "Равенство при заключении договора и подчинение трудовому распорядку в процессе работы", "options": ["Равенство при заключении договора и подчинение трудовому распорядку в процессе работы", "Только государственные запреты без договоров", "Полная свобода сторон без обязательных гарантий", "Подчинение работодателю ещё до заключения договора"], "hint": "Статус сторон меняется между заключением договора и выполнением работы.", "memory": "Метод: государство + договор + распорядок + защита.", "example": "Бариста добровольно заключил договор, но после этого обязан соблюдать утверждённые смены."}, {"id": 5, "topic": 1, "title": "Система трудового права", "answer": "Система трудового права — внутреннее строение отрасли, то есть совокупность взаимосвязанных норм и институтов.\n\nУсловно она делится на Общую и Особенную части.\n\nВ Общую часть входят предмет, метод, принципы, источники и субъекты. В Особенную — трудовой договор, рабочее время, отдых, зарплата, дисциплина, охрана труда, материальная ответственность и трудовые споры.", "prompt": "Какой институт относится к Особенной части трудового права?", "correct": "Трудовой договор", "options": ["Трудовой договор", "Предмет трудового права", "Принципы трудового права", "Источники трудового права"], "hint": "Общая часть задаёт основы, Особенная регулирует конкретные стороны труда.", "memory": "Общая — основы. Особенная — договор, время, оплата, защита.", "example": "Сначала выясняем, кто такой работник, затем — сколько он работает и как получает зарплату."}, {"id": 6, "topic": 1, "title": "Соотношение трудового права с другими отраслями", "answer": "Трудовое право тесно связано с другими отраслями.\n\nС конституционным правом — через свободу труда, право на отдых, оплату и защиту от безработицы.\n\nОт гражданского права отличается тем, что работник лично выполняет трудовую функцию и подчиняется правилам работодателя, тогда как в гражданском договоре обычно важен конечный результат работы.\n\nПраво социального обеспечения регулирует уже пенсии, пособия и другие социальные выплаты.", "prompt": "Что отличает трудовой договор от гражданского договора подряда?", "correct": "Личное выполнение трудовой функции и подчинение трудовому распорядку", "options": ["Личное выполнение трудовой функции и подчинение трудовому распорядку", "Обязательное отсутствие оплаты", "Только наличие письменного документа", "Выполнение исключительно разового результата без трудового распорядка"], "hint": "Вспомни: постоянная функция и правила работодателя.", "memory": "Трудовой: функция + лично + распорядок. Подряд: результат.", "example": "Бариста на постоянных сменах — трудовые отношения; независимый мастер разово чинит кофемашину — обычно гражданско-правовые.", "supplement": "С административным правом трудовое право соприкасается в вопросах государственного контроля. Отличая трудовой договор от гражданско-правового, смотри на реальное содержание отношений: трудовую функцию, управление работодателя и трудовой распорядок."}, {"id": 7, "topic": 2, "title": "Понятие и система источников и форм трудового права", "answer": "Форма трудового права — это внешняя форма выражения норм трудового права, то есть где именно юридически закреплено соответствующее правило.\n\nОсновные формы: Конституция РФ, ТК РФ и другие федеральные законы, подзаконные акты, законы субъектов РФ, муниципальные и локальные акты, коллективные договоры и соглашения.\n\nОсобенность трудового права в том, что нормы создаёт не только государство, но также работодатели и стороны социального партнёрства.", "prompt": "Что является примером формы трудового права?", "correct": "Коллективный договор, содержащий нормы трудового права", "options": ["Коллективный договор, содержащий нормы трудового права", "Любой личный совет директора", "Любое устное пожелание коллеги", "Личный ежедневник работника"], "hint": "Форма показывает, где юридически закреплено правило.", "memory": "Источники: государство + работодатель + социальные партнёры.", "example": "Правило об отпуске есть в ТК; порядок премирования может уточняться локальным положением."}, {"id": 8, "topic": 2, "title": "Конституция РФ как фундаментальный НПА", "answer": "Конституция РФ — основа трудового права, поскольку обладает высшей юридической силой, а остальные нормативные акты должны ей соответствовать.\n\nГлавная статья — ст. 37 Конституции РФ. Она закрепляет свободу труда, запрещает принудительный труд, гарантирует безопасные условия, оплату труда без дискриминации, защиту от безработицы, право на трудовые споры и отдых.\n\nТакже важны нормы о равенстве и судебной защите.", "prompt": "Какая статья Конституции РФ закрепляет основные трудовые права?", "correct": "Статья 37", "options": ["Статья 37", "Статья 63", "Статья 273", "Статья 5"], "hint": "Запомни опорное число для свободы труда и права на отдых.", "memory": "37: свобода, безопасность, оплата, защита, споры, отдых.", "example": "Нельзя обязать человека работать в конкретной кофейне против его воли."}, {"id": 9, "topic": 2, "title": "Международные акты. Конвенции МОТ", "answer": "Международные акты устанавливают общие международные стандарты в сфере труда.\n\nОсобое значение имеют акты МОТ — Международной организации труда. Она действует на принципе трипартизма, то есть в её деятельности участвуют государства, работодатели и работники.\n\nКонвенция МОТ после её ратификации государством становится обязательной. Рекомендация МОТ носит рекомендательный характер.\n\nОсновные направления: запрет принудительного труда и дискриминации, свобода объединения, охрана труда.", "prompt": "Чем конвенция МОТ отличается от рекомендации МОТ?", "correct": "Ратифицированная конвенция обязательна, рекомендация имеет рекомендательный характер", "options": ["Ратифицированная конвенция обязательна, рекомендация имеет рекомендательный характер", "Любая конвенция обязательна без ратификации", "Рекомендация обязательна, конвенция — только совет", "Оба документа принимает конкретный работодатель"], "hint": "Ключевое слово для конвенции — ратификация.", "memory": "МОТ: государство + работодатели + работники. Конвенция → ратификация.", "example": "Государства принимают международные обязательства о недопущении принудительного труда."}, {"id": 10, "topic": 2, "title": "Федеральные законы. Трудовой кодекс РФ", "answer": "ТК РФ — основной кодифицированный федеральный закон в сфере труда.\n\nОн принят 30 декабря 2001 года, а действует с 1 февраля 2002 года.\n\nТК регулирует трудовые и непосредственно связанные с ними отношения. Его особенность в том, что нормы трудового права, содержащиеся в других федеральных законах, должны соответствовать ТК РФ.\n\nПоэтому ТК имеет центральное, системообразующее значение для всей отрасли.", "prompt": "Когда Трудовой кодекс РФ вступил в силу?", "correct": "1 февраля 2002 года", "options": ["1 февраля 2002 года", "30 декабря 2001 года", "12 декабря 1993 года", "17 марта 2004 года"], "hint": "Дата принятия и дата начала действия — разные даты.", "memory": "ТК: принят 30.12.2001 → действует с 01.02.2002.", "example": "Нормы о трудовом договоре или отпуске бариста ищем прежде всего в ТК."}, {"id": 11, "topic": 2, "title": "Локальные нормативные акты", "answer": "Локальный нормативный акт — ЛНА — это акт работодателя, содержащий нормы трудового права и действующий у конкретного работодателя.\n\nПримеры: правила внутреннего трудового распорядка, положение об оплате труда, положение о премировании.\n\nЛНА принимаются работодателем в пределах его компетенции, а в установленных случаях — с учётом мнения представительного органа работников.\n\nГлавное правило: ЛНА не может ухудшать положение работника по сравнению с законодательством.", "prompt": "Работодатель принял ЛНА, снижающий законные гарантии работника. Что верно?", "correct": "Ухудшающие положение нормы ЛНА не подлежат применению", "options": ["Ухудшающие положение нормы ЛНА не подлежат применению", "ЛНА всегда имеет приоритет над ТК РФ", "Норма законна, если с ней ознакомили работника", "Норма автоматически становится федеральным законом"], "hint": "Локальные правила не могут снижать гарантии более высокого уровня.", "memory": "ЛНА: правила работодателя, но не ниже установленных гарантий.", "example": "В кофейне можно закрепить порядок премий, но нельзя отменить законный оплачиваемый отпуск.", "supplement": "Локальные нормы не должны ухудшать положение работников не только по сравнению с законодательством, но и по сравнению с коллективными договорами и соглашениями. Например, положение о премировании не может отменить предусмотренные ими гарантии."}, {"id": 12, "topic": 2, "title": "Договорное регулирование трудовых отношений", "answer": "Договорное регулирование означает, что условия труда устанавливаются не только государством, но и по соглашению сторон.\n\nОсновные формы: коллективный договор, соглашения и трудовой договор.\n\nКоллективный договор действует у конкретного работодателя, соглашения — на более широком уровне, например отраслевом или региональном.\n\nГлавное ограничение: договорные условия не должны снижать гарантии, установленные законодательством.", "prompt": "Где обычно действует коллективный договор?", "correct": "У конкретного работодателя", "options": ["У конкретного работодателя", "Автоматически во всех странах МОТ", "Только в Верховном Суде РФ", "Во всех организациях России независимо от их участия"], "hint": "Сравни коллективный договор с отраслевым или региональным соглашением.", "memory": "Договор — у работодателя. Соглашение — уровень отрасли, региона и выше.", "example": "Бариста согласовал оплату в трудовом договоре, а общая система премий закреплена коллективно.", "supplement": "Коллективный договор действует на уровне организации или индивидуального предпринимателя. Соглашения охватывают более широкие уровни, например отрасль или регион. Трудовой договор определяет условия работы конкретного работника."}, {"id": 13, "topic": 2, "title": "Действие норм во времени, пространстве и по кругу лиц", "answer": "Здесь нужно различать три направления.\n\nВо времени — норма действует после вступления в силу и обычно не имеет обратной силы.\n\nВ пространстве — федеральные нормы действуют по всей России, региональные — на территории соответствующего субъекта, локальные — у конкретного работодателя.\n\nПо кругу лиц — нормы трудового права распространяются прежде всего на работников и работодателей.\n\nЗапомнить: когда? где? на кого?", "prompt": "Какие три вопроса описывают действие норм трудового права?", "correct": "Когда? Где? На кого?", "options": ["Когда? Где? На кого?", "Кем? Почём? Как долго?", "Зачем? Сколько? С кем?", "Кто виноват? Что делать? Кто платит?"], "hint": "Время, пространство и круг лиц.", "memory": "Действие нормы: когда → где → на кого.", "example": "Новое положение о премиях действует у этой кофейни с установленной в нём даты.", "supplement": "Для действия во времени важно назвать не только момент вступления нормы в силу, но и прекращение её действия. Для круга лиц нужно учитывать специальные категории работников и предусмотренные законом исключения."}, {"id": 14, "topic": 2, "title": "Единство и дифференциация регулирования труда", "answer": "Единство означает наличие общих правил и гарантий, которые распространяются на всех работников.\n\nДифференциация — установление специальных норм для отдельных категорий работников из-за объективных особенностей их труда.\n\nНапример, общие правила действуют для всех, но дополнительные гарантии устанавливаются несовершеннолетним, беременным, дистанционным работникам и другим категориям.\n\nТо есть единство обеспечивает общий минимум, а дифференциация учитывает особенности.", "prompt": "Дополнительные гарантии для несовершеннолетних — пример чего?", "correct": "Дифференциации правового регулирования", "options": ["Дифференциации правового регулирования", "Отмены единства трудового права", "Дискриминации в любом случае", "Замены трудового права гражданским"], "hint": "Общие гарантии сохраняются, особенности категории учитываются.", "memory": "Единство — общий минимум. Дифференциация — объективные особенности.", "example": "Бариста в 17 лет имеет дополнительные ограничения по рабочему времени."}, {"id": 15, "topic": 2, "title": "Значение постановлений высших судебных органов", "answer": "Высшие суды имеют большое значение для правильного и единообразного применения трудового законодательства.\n\nВерховный Суд разъясняет, как следует понимать и применять нормы ТК РФ, особенно если законодательная формулировка допускает разное толкование.\n\nГлавный пример — Постановление Пленума ВС РФ от 17.03.2004 № 2 о применении судами Трудового кодекса РФ.\n\nТо есть суд не заменяет закон, а разъясняет его применение.", "prompt": "Какова роль разъяснений Пленума Верховного Суда РФ?", "correct": "Помогать правильно и единообразно применять трудовое законодательство", "options": ["Помогать правильно и единообразно применять трудовое законодательство", "Принимать трудовые договоры за работодателей", "Заменять ТК РФ локальными правилами", "Устанавливать зарплату каждому работнику"], "hint": "Речь о толковании и применении норм судами.", "memory": "Высшие суды: толкование + единообразное применение. Пленум № 2 от 17.03.2004.", "example": "При споре об увольнении суды ориентируются на закон и разъяснения Верховного Суда."}, {"id": 16, "topic": 3, "title": "Понятие и значение принципов трудового права", "answer": "Принципы трудового права — это основные руководящие идеи, которые отражают сущность и направленность регулирования труда.\n\nОни показывают, на каких началах строится трудовое законодательство, помогают толковать нормы и правильно их применять.\n\nОсновные отраслевые принципы закреплены прежде всего в ст. 2 ТК РФ.", "prompt": "Что такое принципы трудового права?", "correct": "Основные руководящие идеи, определяющие направленность регулирования труда", "options": ["Основные руководящие идеи, определяющие направленность регулирования труда", "Перечень должностей организации", "Только пункты трудового договора", "Любые привычки рабочего коллектива"], "hint": "Это основы, на которых строятся нормы.", "memory": "Принципы — руководящие идеи. Основные отраслевые — статья 2 ТК РФ.", "example": "При неясности правила его толкуют с учётом свободы труда и защиты работника."}, {"id": 17, "topic": 3, "title": "Виды принципов трудового права", "answer": "Обычно выделяют:\n\n\t•\tобщеправовые — действуют во всей системе права;\n\t•\tмежотраслевые — характерны для нескольких отраслей;\n\t•\tотраслевые — непосредственно для трудового права;\n\t•\tпринципы отдельных институтов трудового права.\n\nНапример, свобода труда и запрет принудительного труда являются важнейшими отраслевыми принципами.", "prompt": "Как обычно классифицируют принципы трудового права?", "correct": "Общеправовые, межотраслевые, отраслевые и принципы отдельных институтов", "options": ["Общеправовые, межотраслевые, отраслевые и принципы отдельных институтов", "Федеральные, местные и домашние", "Письменные, устные и электронные", "Платные, бесплатные и добровольные"], "hint": "Двигайся от всей системы права к отдельному институту.", "memory": "Всё право → несколько отраслей → отрасль → институт.", "example": "Равенство — широкий принцип, а гарантии своевременной оплаты конкретизируются в трудовом праве.", "supplement": "Общеправовые принципы действуют во всей системе права, например законность и равенство. Отраслевые характеризуют трудовое право, а принципы отдельных институтов относятся к конкретным блокам, например оплате труда."}, {"id": 18, "topic": 3, "title": "Содержание основных принципов", "answer": "К основным принципам трудового права относятся:\n\nсвобода труда; запрет принудительного труда и дискриминации; право на безопасные условия труда; право на справедливую заработную плату и отдых; социальное партнёрство; защита трудовых прав; право на разрешение трудовых споров.\n\nТо есть принципы обеспечивают как свободу работника, так и его основные социальные гарантии.", "prompt": "Какой набор соответствует основным принципам трудового права?", "correct": "Свобода труда, равенство возможностей, безопасные условия, справедливая оплата и защита прав", "options": ["Свобода труда, равенство возможностей, безопасные условия, справедливая оплата и защита прав", "Обязательная работа, неограниченные штрафы и отказ от отдыха", "Только свобода предпринимательства и защита собственности", "Приоритет приказов работодателя над любым законом"], "hint": "Вспомни свободу работника и его социальные гарантии.", "memory": "Свобода + равенство + безопасность + оплата и отдых + защита.", "example": "Бариста вправе выбрать работу, получать зарплату вовремя и обжаловать незаконное увольнение."}, {"id": 19, "topic": 3, "title": "Свобода труда", "answer": "Свобода труда означает, что человек самостоятельно распоряжается своими способностями к труду.\n\nОн сам решает, работать ему или нет, где работать и какую профессию выбрать.\n\nСвобода труда также означает возможность добровольно заключить трудовой договор и прекратить его в установленном законом порядке.\n\nПринуждать человека к определённой работе без законных оснований нельзя.", "prompt": "Что означает свобода труда?", "correct": "Человек сам распоряжается способностями к труду и выбирает род деятельности", "options": ["Человек сам распоряжается способностями к труду и выбирает род деятельности", "Государство обязано назначить каждому конкретную должность", "Работодатель вправе запретить увольнение навсегда", "Любые обязанности по заключённому договору можно игнорировать"], "hint": "Добровольный выбор работы сочетается с установленным порядком договора.", "memory": "Свобода: работать ли, где и кем; договор доброволен.", "example": "Нельзя заставить выпускника трудоустроиться именно в эту кофейню."}, {"id": 20, "topic": 3, "title": "Запрещение принудительного труда", "answer": "Принудительный труд — работа, которую человек вынужден выполнять под угрозой наказания или другого воздействия, не соглашаясь на неё добровольно.\n\nОн запрещён Конституцией РФ и ст. 4 ТК РФ.\n\nКлючевые признаки: отсутствие добровольного согласия + наличие принуждения или угрозы.\n\nПри этом законом предусмотрены отдельные случаи, которые принудительным трудом не считаются, например военная служба.", "prompt": "Какая ситуация указывает на принудительный труд?", "correct": "Работа под угрозой наказания при отсутствии добровольного согласия", "options": ["Работа под угрозой наказания при отсутствии добровольного согласия", "Любая работа по добровольно заключённому договору", "Любая сложная работа с высокой нагрузкой", "Любая оплачиваемая работа по найму"], "hint": "Нужны два признака: принуждение и отсутствие добровольности.", "memory": "Принудительный труд: угроза + нет добровольного согласия. Статья 4 ТК.", "example": "Угроза наказать за отказ от незаконно навязанной работы — типичный тревожный признак.", "supplement": "Статья 4 ТК РФ охватывает и отдельные случаи принуждения к работе, от которой человек вправе отказаться, в том числе при угрозе его жизни и здоровью вследствие нарушения требований охраны труда. При ответе важно упомянуть, что закон предусматривает случаи, которые принудительным трудом не считаются."}, {"id": 21, "topic": 3, "title": "Запрещение дискриминации", "answer": "В сфере труда каждый имеет равные возможности для реализации своих прав.\n\nДискриминация — необоснованное ограничение прав или предоставление преимуществ по обстоятельствам, которые не связаны с деловыми качествами работника.\n\nНапример, отказ из-за недостаточной квалификации допустим, а отказ только из-за национальности или пола — дискриминация, если это не связано с объективными требованиями работы.", "prompt": "Какая причина отказа в приёме обычно связана с деловыми качествами?", "correct": "Недостаточная квалификация для конкретной работы", "options": ["Недостаточная квалификация для конкретной работы", "Национальность соискателя сама по себе", "Пол соискателя без объективного законного основания", "Религиозные убеждения, не связанные с работой"], "hint": "Оценивают способность выполнять работу, а не личные признаки.", "memory": "Дискриминация: различия по причинам, не связанным с деловыми качествами.", "example": "Не нанять бариста из-за отсутствия нужного навыка — возможно; из-за национальности — нельзя.", "supplement": "Работодатель вправе учитывать квалификацию и навыки, необходимые для конкретной работы. Законные специальные требования и дополнительные гарантии для отдельных категорий не следует автоматически считать дискриминацией."}, {"id": 22, "topic": 3, "title": "Защита от безработицы и содействие трудоустройству", "answer": "Защита от безработицы — один из основных принципов трудового права.\n\nГосударство должно создавать условия для занятости населения: помогать гражданам искать работу, обеспечивать профессиональное обучение и предоставлять меры поддержки безработным.\n\nПри этом государство не обязано предоставить человеку конкретную должность, но должно обеспечить систему содействия занятости и социальной защиты от безработицы.", "prompt": "Что означает государственное содействие трудоустройству?", "correct": "Помощь в поиске работы, обучении и поддержка безработных", "options": ["Помощь в поиске работы, обучении и поддержка безработных", "Гарантия любой выбранной гражданином должности", "Обязательное трудоустройство без согласия гражданина", "Запрет менять профессию после получения образования"], "hint": "Государство создаёт систему поддержки занятости.", "memory": "Занятость: поиск + обучение + поддержка, без гарантии конкретной вакансии.", "example": "Служба занятости помогает человеку подобрать вакансии или пройти переобучение."}, {"id": 23, "topic": 4, "title": "Понятие и классификация субъектов", "answer": "Субъекты трудового права — участники трудовых и непосредственно связанных с ними отношений, которые обладают трудовыми правами и обязанностями и способны их реализовывать.\n\nГлавные субъекты — работник и работодатель.\n\nТакже относятся профсоюзы, представители работников, объединения работодателей, органы государственного контроля, службы занятости и органы по рассмотрению трудовых споров.", "prompt": "Кто относится к субъектам трудового права помимо работника и работодателя?", "correct": "Профсоюзы, объединения работодателей и органы разрешения трудовых споров", "options": ["Профсоюзы, объединения работодателей и органы разрешения трудовых споров", "Только покупатели продукции работодателя", "Любые животные и вещи организации", "Только наследники работника"], "hint": "Вспомни участников непосредственно связанных с трудом отношений.", "memory": "Субъекты: стороны + представители + контроль + занятость + разрешение споров.", "example": "Бариста и кофейня — основные стороны; профсоюз может представлять интересы сотрудников."}, {"id": 24, "topic": 4, "title": "Правовой статус субъекта трудового права", "answer": "Правовой статус — это юридическое положение субъекта в трудовом праве.\n\nОн включает:\n\n\t•\tтрудовую правосубъектность — способность иметь и реализовывать трудовые права и обязанности;\n\t•\tосновные права и обязанности;\n\t•\tгарантии их реализации;\n\t•\tответственность за трудовые правонарушения.\n\nЗапомнить: способность → права и обязанности → гарантии → ответственность.", "prompt": "Что включает правовой статус субъекта трудового права?", "correct": "Правосубъектность, права и обязанности, гарантии и ответственность", "options": ["Правосубъектность, права и обязанности, гарантии и ответственность", "Только должность и размер зарплаты", "Только возраст и стаж", "Только права без обязанностей"], "hint": "Сначала способность участвовать, затем содержание и обеспечение статуса.", "memory": "Способность → права и обязанности → гарантии → ответственность.", "example": "У бариста есть право на оплату и обязанность работать; при нарушении прав — средства защиты.", "supplement": "Статус удобно объяснять на одном человеке: у бариста есть способность участвовать в трудовых отношениях, право на зарплату и обязанность выпо  <div class="stack"><section class="panel route-panel"><div class="route-head"><div><span class="eyebrow muted">Твой маршрут</span><h2 style="margin-top:8px">Четыре темы до зачёта</h2></div></div><div class="row between" style="margin-bottom:12px"><div class="route-score">${count} <span>/ 27 закреплено</span></div><small class="muted">${Math.round(count/27*100)}%</small></div>${bar(count,27)}
 ${TOPICS.map((title,i)=>{const qs=QUESTIONS.filter(q=>q.topic===i+1),n=qs.filter(q=>mastered(q.id)).length;return `<button class="topic" data-action="topic" data-topic="${i+1}" aria-label="${escapeHTML(title)}, закреплено ${n} из ${qs.length}. Начать раунд по теме"><span class="topic-num">0${i+1}</span><span class="topic-info"><span class="topic-name">${title}</span><small>${n} из ${qs.length} закреплено</small>${bar(n,qs.length)}</span>${icon('arrow','topic-arrow')}</button>`}).join('')}</section><p class="tip">${icon('bulb')}<span>Два верных ответа подряд без подсказки — вопрос закреплён. Возвращайся к нему и проговаривай ответ вслух.</span></p></div></div>`}
function bar(n,total,label='Закреплено вопросов'){return `<div class="bar" role="progressbar" aria-label="${label}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${total}"><span style="width:${n/total*100}%"></span></div>`}
function modeName(mode){return {quiz:'Раунд',cards:'Карточки',exam:'Коллоквиум',mistakes:'Повтор ошибок'}[mode]}
function cardSetName(){return run?.cardSet==='random'?'Карточки вразброс':run?.cardSet?.startsWith('topic-')?'Тема '+run.cardSet.slice(-1)+' · По порядку':modeName(run?.mode)}
function topicsView(){return `<section><div class="notes-top"><span class="eyebrow muted">Карточки по порядку</span><h1>Одна тема за раз</h1><p class="muted">Выбери тему. Вопросы идут в том же порядке, что и в твоём тексте. Для каждой темы сохраняется своё место.</p></div><div class="topic-cards-grid">${TOPICS.map((title,i)=>{const deck=QUESTIONS.filter(q=>q.topic===i+1),s=state.cardSessions['topic-'+(i+1)],n=s?.answers.length||0;return `<button class="topic-card" data-action="ordered-cards" data-topic="${i+1}"><span class="row between"><span class="pill">Тема ${i+1}</span><small class="muted">${deck.length} карточек</small></span><h2>${title}</h2><p>${s?.done?'Круг завершён. Можно повторить тему.':n?`Остановился на карточке ${s.index+1} из ${deck.length}.`:'От первого вопроса к последнему, без перемешивания.'}</p>${bar(n,deck.length,'Пройдено карточек в теме '+(i+1))}<span class="topic-card-footer">${s?.done?'Посмотреть итог':n?'Продолжить тему':'Начать тему'}${icon('arrow')}</span></button>`}).join('')}</div><p class="tip">${icon('bulb')}<span>Хочешь проверить себя вперемешку? Во вкладке «Вразброс» собраны все 27 карточек из четырёх тем.</span></p></section>`}
function activateCardSet(key,restart=false){save();let saved=state.cardSessions[key];if(!saved||restart){const pool=key==='random'?shuffle(QUESTIONS):QUESTIONS.filter(q=>q.topic===Number(key.slice(-1)));saved={mode:'cards',cardSet:key,deck:pool.map(q=>({id:q.id,options:[...q.options]})),index:0,answers:[],done:false,gained:0,hinted:false};state.cardSessions[key]=saved}run=saved;revealed=false;save()}
function extrasHTML(q){return `${q.example?`<div class="card-example"><b>Пример</b>${escapeHTML(q.example)}</div>`:''}${q.supplement?`<details class="review card-supplement"><summary>Чуть подробнее</summary><div class="answer-text">${answerHTML(q.supplement)}</div></details>`:''}`}
function emptyView(){return `<section class="panel game empty">${icon('check')}<h1 class="question">Ошибок пока нет</h1><p>Начни раунд. Вопросы, которые стоит повторить, появятся здесь.</p><button class="btn primary" data-action="start" data-mode="quiz">Начать раунд ${icon('arrow')}</button></section>`}
function start(mode,topic){if(mode==='cards'){go('random');return}let pool=topic?QUESTIONS.filter(q=>q.topic===Number(topic)):mode==='mistakes'?missed():QUESTIONS;if(!pool.length){go('empty');return}
 const sorted=shuffle(pool);if(mode==='quiz')sorted.sort((a,b)=>(rec(a.id).streak>=2?1:0)-(rec(b.id).streak>=2?1:0));const size=mode==='exam'?10:mode==='mistakes'?pool.length:7;
 run={mode,deck:sorted.slice(0,size).map(q=>({id:q.id,options:shuffle(q.options)})),index:0,answers:[],done:false,gained:0,hinted:false};revealed=false;save();go('play');
}
function playView(){const d=run.deck[run.index],q=questionById(d.id),answer=run.answers[run.index],isCard=run.mode==='cards';return `<section class="game"><div class="row between game-top cards-top"><button class="btn ghost" data-action="${run.cardSet?.startsWith('topic-')?'topics':'home'}">${icon('back')}${run.cardSet?.startsWith('topic-')?'Все темы':'На главную'}</button><span class="pill">${cardSetName()}</span></div>${run.cardSet==='random'?'<p class="card-intro">Все 27 вопросов вперемешку. Каждая карточка встретится один раз за круг.</p>':run.cardSet?'<p class="card-intro">Карточки этой темы идут по порядку, как в твоём тексте.</p>':''}<div class="row between"><small class="muted">Вопрос ${run.index+1} из ${run.deck.length}</small><small class="muted">${run.mode==='exam'?'Разбор после 10 вопросов':isCard?'Вспоминай вслух':`Верно: ${run.answers.filter(a=>a.correct).length}`}</small></div><div class="game-progress">${bar(run.index,run.deck.length,'Пройдено вопросов')}</div><div class="panel"><p class="game-kicker">Тема ${q.topic} · ${TOPICS[q.topic-1]}</p>
 ${isCard?cardView(q):`<h1 class="question">${escapeHTML(q.prompt)}</h1><div class="options">${d.options.map((o,i)=>{const correct=o===q.correct,chosen=answer?.choice===o;let cls='';if(answer){if(run.mode==='exam')cls=chosen?'selected':'';else cls=correct?'correct':chosen?'wrong':''}return `<button class="option ${cls}" data-action="answer" data-choice="${i}" ${answer?'disabled':''}><span class="option-letter">${answer&&run.mode!=='exam'&&(correct||chosen)?icon(correct?'check':'cross'):String.fromCharCode(65+i)}</span><span>${escapeHTML(o)}${answer&&run.mode!=='exam'&&correct?'<span class="sr-only"> — правильный ответ</span>':''}${chosen?'<span class="sr-only"> — ваш ответ</span>':''}</span></button>`}).join('')}</div>
 ${answer?run.mode==='exam'?'<p class="notice" role="status">Ответ принят. Результат — в конце.</p>':feedback(q,answer):run.mode!=='exam'?`<button class="btn ghost" data-action="hint">${icon('bulb')}${run.hinted?'Подсказка открыта':'Нужна подсказка'}</button>${run.hinted?`<div class="memory" role="status">${escapeHTML(q.hint)}<small class="muted" style="display:block;margin-top:8px">Этот ответ будет без очков и не повысит освоение.</small></div>`:''}`:''}
 ${answer?`<div class="game-actions"><button class="btn primary full" data-action="next">${run.index===run.deck.length-1?'Посмотреть результат':'Следующий вопрос'}${icon('arrow')}</button></div>`:''}`}
 </div><p class="game-foot">${isCard?'Сначала свой ответ, потом конспект. Так легче запомнить.':run.mode==='exam'?'Один ответ на вопрос. Без подсказок и таймера.':'Одна ошибка — повод повторить, а не начинать с нуля.'}</p></section>`}
function answerHTML(text){return text.split(/\n\s*\n/).map(p=>`<p>${escapeHTML(p.trim()).replace(/\n/g,'<br>')}</p>`).join('')}
function memory(q){return `<div class="memory"><b>Опора для памяти</b>${escapeHTML(q.memory)}</div>`}
function feedback(q,a){return `<div class="feedback ${a.correct?'':'wrong'}" role="status"><h3>${a.correct?(a.hinted?'Верно, с подсказкой':'Верно! +10 очков'):'Пока не так. Разберёмся.'}</h3><p>${escapeHTML(a.correct?q.memory:'Правильный ответ: '+q.correct)}</p>${!a.correct?`<p style="margin-top:10px">${escapeHTML(q.memory)}</p>`:''}${a.hinted?'<small>С подсказкой ответ не повышает освоение.</small>':''}</div><details class="review"><summary>Читать полный ответ</summary><div class="answer-text">${answerHTML(q.answer)}</div>${extrasHTML(q)}</details>`}
function cardView(q){return `<div class="card-question"><span class="eyebrow muted">Вопрос на коллоквиуме</span><h1 class="question">${escapeHTML(q.title)}</h1>${!revealed?'<p class="muted">Дай определение, объясни суть и приведи пример.</p>':''}</div>${!revealed?'<button class="btn primary full" data-action="reveal">Показать ответ '+icon('cards')+'</button>':`<div class="answer-text main-answer">${answerHTML(q.answer)}</div>${memory(q)}${extrasHTML(q)}<p class="notice">Оцени свой ответ: «Помню» повышает освоение и даёт 5 очков.</p><div class="rating"><button class="btn" data-action="rate" data-rating="repeat">${icon('repeat')}Повторить</button><button class="btn primary" data-action="rate" data-rating="remember">${icon('check')}Помню</button></div>`}`}
function answer(index){if(!run||run.done||run.answers[run.index]||run.mode==='cards')return;const d=run.deck[run.index],q=questionById(d.id),choice=d.options[index];if(!choice)return;const a={id:q.id,choice,correct:choice===q.correct,hinted:run.hinted};run.answers.push(a);if(run.mode!=='exam')run.gained+=credit(q.id,a.correct,a.hinted,run.mode);save();render();if(run.mode==='exam')announce('Ответ принят');else announce(a.correct?'Верно. '+(a.hinted?'С подсказкой, без очков.':'+10 очков.'):'Неверно. Правильный ответ: '+q.correct);document.querySelector('[data-action="next"]').focus({preventScroll:true})}
function next(){if(!run||run.done||!run.answers[run.index])return;if(run.index===run.deck.length-1){finish();return}run.index++;run.hinted=false;revealed=false;save();render();focusMain()}
function rate(remember){if(!run||run.done||run.mode!=='cards'||!revealed||run.answers[run.index])return;const id=run.deck[run.index].id;run.answers.push({id,choice:remember?'remember':'repeat',correct:remember,hinted:false});run.gained+=credit(id,remember,false,'cards');next()}
function finish(){if(run.done)return;if(run.mode==='exam')for(const a of run.answers)run.gained+=credit(a.id,a.correct,false,'exam');run.done=true;state.history.unshift({mode:run.mode,right:run.answers.filter(a=>a.correct).length,total:run.deck.length,date:Date.now()});state.history=state.history.slice(0,20);save();render();focusMain()}
function resultView(){const right=run.answers.filter(a=>a.correct).length,total=run.deck.length,wrong=run.answers.filter(a=>!a.correct),exam=run.mode==='exam';let title=exam?(right/total>=.8?'Зачёт! Хорошая работа.':'Есть что повторить.'):(right===total?'Отличный раунд!':'Ещё на шаг ближе.');return `<section class="game"><button class="btn ghost" data-action="home">${icon('back')}На главную</button><div class="panel"><div class="result-hero"><span class="result-icon">${icon(right/total>=.8?'trophy':'book')}</span><span class="eyebrow muted">${cardSetName()} · круг завершён</span><div class="result-score">${right}<span> / ${total}</span></div><h1 class="question" style="margin-bottom:12px">${title}</h1><p>${wrong.length?`${wrong.length} вопросов стоит повторить. Они уже в разделе ошибок.`:'Теперь попробуй объяснить ответы своими словами, без вариантов.'}</p>${exam?'<p class="notice">Тренировочный зачёт — от 80% верных ответов.</p>':''}</div><div class="mini-stats"><div class="mini-stat"><strong>+${run.gained}</strong><small>очков за раунд</small></div><div class="mini-stat"><strong>${Math.round(right/total*100)}%</strong><small>${run.mode==='cards'?'ответов «Помню»':'верных ответов'}</small></div></div><div class="stack">${run.cardSet?`<button class="btn primary full" data-action="restart-cards">${run.cardSet==='random'?'Перемешать снова':'Повторить тему по порядку'}${icon('repeat')}</button>${run.cardSet!=='random'?'<button class="btn full" data-action="topics">Выбрать другую тему</button>':''}`:''}<button class="btn ${run.cardSet?'':'primary'} full" data-action="start" data-mode="${wrong.length?'mistakes':'quiz'}">${wrong.length?'Повторить ошибки':'Ещё один раунд'}${icon('arrow')}</button><button class="btn full" data-action="home">На главную</button></div>${(exam?run.answers:wrong).length?'<div class="section-title"><h2>Разбор ответов</h2></div>':''}${(exam?run.answers:wrong).map(a=>{const q=questionById(a.id);return `<details class="review"><summary>${a.correct?'Верно':'Повторить'} · ${escapeHTML(q.title)}</summary>${run.mode!=='cards'?`<p class="${a.correct?'right-text':'wrong-text'}">Твой ответ: ${escapeHTML(a.choice)}</p><p class="right-text">Правильный: ${escapeHTML(q.correct)}</p>`:''}${memory(q)}<div class="answer-text" style="margin-top:16px">${answerHTML(q.answer)}</div></details>`}).join('')}</div></section>`}
function notesView(){return `<section><div class="notes-top"><span class="eyebrow muted">Когда нужно освежить память</span><h1>Твой конспект</h1><p class="muted">27 ответов из твоих материалов. Открывай вопрос и проговаривай самое важное.</p></div><div class="filters"><div><label class="sr-only" for="search">Поиск по вопросам и ответам</label><input class="input" id="search" type="search" placeholder="Найти вопрос или слово…" value="${escapeHTML(query)}"></div><div><label class="sr-only" for="topic-filter">Фильтр по теме</label><select class="input" id="topic-filter"><option value="all">Все темы</option>${TOPICS.map((t,i)=>`<option value="${i+1}" ${filter===String(i+1)?'selected':''}>${i+1}. ${t}</option>`).join('')}</select></div></div><div id="note-list">${notesList()}</div><div class="source-note"><p>Основа: твои «Коллоквиум 1.docx» и «текст(1).txt». Примеры и отдельные пояснения добавлены по дополнительному конспекту. Основные ответы сохранены.</p><details style="margin-top:14px"><summary style="min-height:44px;cursor:pointer">Нормативные источники</summary><p>ТК РФ: статьи 1–5, 8–13, 15, 20–22, 63 и глава 43. Конституция РФ: статья 37.</p><a href="https://www.consultant.ru/document/cons_doc_LAW_34683/" target="_blank" rel="noopener noreferrer">Трудовой кодекс РФ</a><br><a href="https://constitution.garant.ru/rf/chapter/9db18ed28bd6c0256461e303941d7e7a/" target="_blank" rel="noopener noreferrer">Конституция РФ, статья 37</a><br><a href="https://www.consultant.ru/document/cons_doc_LAW_47257/" target="_blank" rel="noopener noreferrer">Постановление Пленума ВС РФ от 17.03.2004 № 2</a></details></div></section>`}
function notesList(){const search=query.trim().toLocaleLowerCase('ru-RU'),qs=QUESTIONS.filter(q=>(filter==='all'||q.topic===Number(filter))&&(!search||(q.title+' '+q.answer+' '+q.memory+' '+(q.example||'')+' '+(q.supplement||'')).toLocaleLowerCase('ru-RU').includes(search)));return `<p class="muted" style="font-size:.8rem;margin-bottom:12px" role="status">Найдено: ${qs.length} из 27</p>${qs.length?qs.map(q=>`<details class="note-card"><summary><span><span class="note-label">Тема ${q.topic} · Вопрос ${q.id}${mastered(q.id)?' · Закреплён':rec(q.id).missed?' · Повторить':''}</span>${escapeHTML(q.title)}</span>${icon('chevron')}</summary><div class="note-content"><div class="answer-text">${answerHTML(q.answer)}</div>${memory(q)}${extrasHTML(q)}<button class="btn" data-action="one-card" data-id="${q.id}">${icon('cards')}Проверить себя</button></div></details>`).join(''):'<div class="panel empty"><h2>Ничего не нашлось</h2><p>Попробуй другое слово или выбери все темы.</p><button class="btn" data-action="clear-search">Сбросить поиск</button></div>'}`}
function statsView(){const learned=QUESTIONS.filter(q=>mastered(q.id)).length,seen=QUESTIONS.filter(q=>rec(q.id).seen>0).length;return `<section><span class="eyebrow muted">Каждый раунд считается</span><h1 class="stats-title">Твой прогресс</h1><p class="muted">Два верных ответа подряд без подсказки закрепляют вопрос. Самооценка по карточкам тоже учитывается.</p><div class="stat-grid"><div class="panel"><strong>${learned}<span class="muted" style="font-size:1rem"> / 27</span></strong><small>закреплено</small></div><div class="panel"><strong>${seen}<span class="muted" style="font-size:1rem"> / 27</span></strong><small>уже повторено</small></div><div class="panel"><strong>${state.xp}</strong><small>очков заработано</small></div></div><div class="layout"><section class="panel"><h2>Недавние раунды</h2>${state.history.length?state.history.map(h=>`<div class="history-row"><span>${modeName(h.mode)}<small>${new Date(h.date).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></span><strong>${h.right} / ${h.total}</strong></div>`).join(''):'<p class="muted" style="margin-top:16px">Первый завершённый раунд появится здесь.</p>'}</section><section class="panel"><div class="mode-icon">${icon('repeat')}</div><h2>Вернуться к сложному</h2><p class="muted" style="margin:12px 0 20px">${missed().length?`${missed().length} вопросов в повторении. Верный ответ без подсказки уберёт вопрос из ошибок.`:'Ошибок пока нет. Можно пройти новый раунд или попробовать коллоквиум.'}</p><button class="btn full" data-action="start" data-mode="${missed().length?'mistakes':'quiz'}">${missed().length?'Повторить ошибки':'Начать раунд'}${icon('arrow')}</button></section></div><div class="reset-panel"><p class="muted">Прогресс хранится только в этом браузере и не отправляется на сервер.</p><button class="btn ghost" data-action="confirm-reset">Сбросить прогресс</button><div id="reset-confirm" hidden class="reset-confirm"><p>Удалить очки, освоение, ошибки и сохранённый раунд? Восстановить их будет нельзя.</p><div class="row wrap"><button class="btn danger" data-action="reset">Да, удалить прогресс</button><button class="btn" data-action="cancel-reset">Отмена</button></div></div></div></section>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case'home':case'notes':case'stats':case'random':case'topics':go(b.dataset.action);break;case'theme':toggleTheme();break;case'ordered-cards':go('topic-'+b.dataset.topic);break;case'restart-cards':{const key=run.cardSet;activateCardSet(key,true);go(key);break}case'start':start(b.dataset.mode);break;case'topic':start('quiz',b.dataset.topic);break;case'resume':go(runRoute());break;case'answer':answer(Number(b.dataset.choice));break;case'hint':if(run&&!run.answers[run.index]&&!run.hinted){run.hinted=true;save();render();document.querySelector('[data-action="hint"]').focus({preventScroll:true})}break;case'next':next();break;case'reveal':revealed=true;render();document.querySelector('[data-rating="repeat"]').focus({preventScroll:true});break;case'rate':rate(b.dataset.rating==='remember');break;case'one-card':{const q=questionById(Number(b.dataset.id));run={mode:'cards',deck:[{id:q.id,options:shuffle(q.options)}],index:0,answers:[],done:false,gained:0,hinted:false};revealed=false;save();go('play');break}case'clear-search':query='';filter='all';render();document.getElementById('search').focus();break;case'confirm-reset':document.getElementById('reset-confirm').hidden=false;document.querySelector('[data-action="cancel-reset"]').focus();break;case'cancel-reset':document.getElementById('reset-confirm').hidden=true;document.querySelector('[data-action="confirm-reset"]').focus();break;case'reset':state=fresh();run=null;save();render();focusMain();announce('Прогресс сброшен');break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('note-list').innerHTML=notesList()}});
document.addEventListener('change',e=>{if(e.target.id==='topic-filter'){filter=e.target.value;document.getElementById('note-list').innerHTML=notesList()}});
function route(){const hash=location.hash.slice(1);if(hash==='random'){activateCardSet('random');screen='random'}else if(/^topic-[1-4]$/.test(hash)){activateCardSet(hash);screen='ordered'}else{screen=['notes','stats','play','empty','topics'].includes(hash)?hash:'home';if(screen==='play'&&!run)screen='home'}revealed=false;render();focusMain()}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',save);
route();
</script>
</body>
